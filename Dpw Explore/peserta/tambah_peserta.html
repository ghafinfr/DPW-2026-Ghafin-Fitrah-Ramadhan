<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVENTHUB | Tambah Peserta</title>
    <link rel="stylesheet" href="../asset/css/style.css" />
  </head>
  <body>
    <header>
      <h1>EVENTHUB</h1>
      <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-label"
        aria-label="Menu"
      >
        &#9776;
      </button>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../event/list.html">Daftar Event</a></li>
          <li><a href="../event/tambah_event.html">Tambah Event</a></li>
          <li><a href="../peserta/list.html">Daftar Peserta</a></li>
          <li><a href="../peserta/tambah_peserta.html">Tambah Peserta</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Tambah Peserta</h2>
        <form id="form-tambah">
          <p>
            <label for="nama">Nama</label><br />
            <input type="text" id="nama" name="nama" required />
          </p>
          <p>
            <label for="no_anggota">No. Anggota</label><br />
            <input type="text" id="no_anggota" name="no_anggota" required />
          </p>
          <p>
            <label for="alamat">Alamat</label><br />
            <input type="text" id="alamat" name="alamat" />
          </p>
          <p>
            <label for="no_hp">No. HP</label><br />
            <input type="text" id="no_hp" name="no_hp" />
          </p>
          <p>
            <label for="email">Email</label><br />
            <input type="email" id="email" name="email" />
          </p>
          <p>
            <button type="submit">Simpan</button>
          </p>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 EventHub</p>
    </footer>
    <script src="../asset/js/app.js"></script>
    <script src="../asset/js/peserta.js"></script>
  </body>
</html>
