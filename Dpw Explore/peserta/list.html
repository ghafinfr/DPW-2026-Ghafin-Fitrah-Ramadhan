<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVENTHUB | Daftar Peserta</title>
    <link rel="stylesheet" href="../asset/css/style.css" />
  </head>
  <body>
    <header>
      <h1>EVENTHUB</h1>
      <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-label"
        aria-label="Menu"
      >
        &#9776;
      </button>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../event/list.html">Daftar Event</a></li>
          <li><a href="../event/tambah_event.html">Tambah Event</a></li>

          <li><a href="../peserta/tambah_peserta.html">Tambah Peserta</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <h2>Daftar Peserta Event</h2>
        <div class="search-box">
          <label for="search-input">Cari Nama Peserta</label>
          <input
            type="text"
            id="search-input"
            placeholder="Ketik nama peserta..."
          />
        </div>
        <p id="loading-indicator" style="display: none">Memuat data...</p>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nama</th>
                <th>Jurusan</th>
                <th>Email</th>
                <th>Event</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 EventHub</p>
    </footer>
    <script src="../asset/js/app.js"></script>
